services:
  # 1. ORIGEM: PostgreSQL com WAL Logical (CDC)
  postgres:
    image: postgres:16-alpine
    container_name: shopvibe-postgres
    environment:
      POSTGRES_USER: shopvibe
      POSTGRES_PASSWORD: shopvibe_password
      POSTGRES_DB: shopvibe_db
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopvibe -d shopvibe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. TRANSPORTE: Apache Kafka em modo KRaft (Sem Zookeeper - ADR-001)
  kafka:
    image: apache/kafka:3.7.0
    container_name: shopvibe-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. INGESTÃO: Kafka Connect + Debezium (ADR-002)
  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: shopvibe-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Auto-registro do conector Debezium (Para funcionar 100% com 'docker compose up')
  debezium-init:
    image: curlimages/curl:8.7.1
    container_name: shopvibe-debezium-init
    depends_on:
      - connect
    entrypoint: >
      /bin/sh -c "
      echo 'Aguardando Kafka Connect iniciar...';
      until curl -s http://connect:8083/connectors; do sleep 3; done;
      echo 'Registrando conector PostgreSQL no Debezium...';
      curl -i -X POST -H 'Accept:application/json' -H 'Content-Type:application/json' http://connect:8083/connectors/ -d '{
        \"name\": \"shopvibe-orders-connector\",
        \"config\": {
          \"connector.class\": \"io.debezium.connector.postgresql.PostgresConnector\",
          \"plugin.name\": \"pgoutput\",
          \"database.hostname\": \"postgres\",
          \"database.port\": \"5432\",
          \"database.user\": \"shopvibe\",
          \"database.password\": \"shopvibe_password\",
          \"database.dbname\": \"shopvibe_db\",
          \"topic.prefix\": \"shopvibe\",
          \"table.include.list\": \"public.orders,public.order_items\",
          \"decimal.handling.mode\": \"double\",
          \"time.precision.mode\": \"connect\"
        }
      }';
      echo 'Conector registrado com sucesso!';
      "

  # 4. ARMAZENAMENTO BRONZE: MongoDB (ADR-003 / RF02)
  mongodb:
    image: mongo:7.0
    container_name: shopvibe-mongodb
    ports:
      - "27017:27017"

  # 5. ARMAZENAMENTO GOLD & ANTIFRAUDE: Redis (ADR-003 / RF03 / RF05)
  redis:
    image: redis:7.2-alpine
    container_name: shopvibe-redis
    ports:
      - "6379:6379"

  # 6. PROCESSAMENTO: Worker Python (Consumer Group)
  consumer:
    build: ./app
    container_name: shopvibe-consumer
    command: python -u consumer.py
    environment:
      KAFKA_BROKER: kafka:29092
      MONGO_URI: mongodb://mongodb:27017/
      REDIS_HOST: redis
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    restart: on-failure

  # 7. ENTREGA: FastAPI REST (ADR-004 / RF04)
  api:
    build: ./app
    container_name: shopvibe-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/
      REDIS_HOST: redis
    depends_on:
      - mongodb
      - redis